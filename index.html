<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>আয়নাঘর</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="toast"></div>
  <div id="stance"></div>
  <div id="debug" class="hidden"></div>
  <div id="touch" class="hidden">
    <div id="stick"><div id="knob"></div></div>
    <button id="btnRun">দৌড়</button>
    <button id="btnCrouch">বসা</button>
  </div>
</div>

<div id="overlay">
  <div class="panel">
    <h1>আয়নাঘর</h1>
    <p class="sub">মিরপুর ১০ · রাত ২টা ১৭</p>
    <div id="loading"><div id="bar"><i></i></div><span id="loadText">মানচিত্র লোড হচ্ছে…</span></div>
    <button id="start" class="hidden">শুরু করুন</button>
    <ul id="help">
      <li><b>W A S D</b> হাঁটা</li><li><b>মাউস</b> চারপাশ দেখা</li>
      <li><b>Shift</b> দৌড়</li><li><b>C</b> বসে চলা</li>
      <li><b>Esc</b> বিরতি</li><li><b>F3</b> তথ্য</li>
    </ul>
    <p class="credit">মানচিত্রের তথ্য © OpenStreetMap contributors (ODbL)</p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
