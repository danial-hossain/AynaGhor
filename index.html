<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>আয়নাঘর</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="toast"></div>
  <div id="cross"></div>
  <div id="objective"></div>
  <div id="meters">
    <div id="bar_noise" class="meter hidden"><span></span><div><i></i></div></div>
    <div id="bar_seen" class="meter hidden"><span></span><div><i></i></div></div>
    <div id="bar_wanted" class="meter hidden"><span></span><div><i></i></div></div>
  </div>
  <div id="prompt"></div>
  <div id="subtitle"></div>
  <div id="matchHud" class="hidden"><span id="matchCount"></span><div id="burn"><i></i></div></div>
  <div id="flame" class="hidden"></div>
  <div id="inv" class="hidden"></div>
  <div id="stance"></div>
  <div id="debug" class="hidden"></div>
  <div id="touch" class="hidden">
    <div id="stick"><div id="knob"></div></div>
    <button id="btnRun">দৌড়</button>
    <button id="btnCrouch">বসা</button>
    <button id="btnE">ধরুন</button>
    <button id="btnF">আলো</button>
  </div>
</div>

<div id="fade"><p id="fadeText"></p></div>
<div id="keypad" class="modal hidden"><div id="kpDisp"></div><div id="kpGrid"></div></div>
<div id="result" class="modal hidden"><h2 id="resTitle"></h2><p id="resText"></p><div id="resBtns" class="btns"></div></div>
<div id="choice" class="modal hidden"><h3 id="chWho"></h3><p id="chText"></p><div id="chBtns" class="btns"></div></div>

<div id="overlay">
  <div class="panel">
    <h1>আয়নাঘর</h1>
    <p class="sub">মিরপুর ১০ · রাত ২টা ১৭</p>
    <div id="loading"><div id="bar"><i></i></div><span id="loadText">মানচিত্র লোড হচ্ছে…</span></div>
    <div id="menu" class="hidden">
      <button id="btnResume" class="big hidden">চালিয়ে যান</button>
      <button id="btnContinue" class="big hidden">আগের জায়গা থেকে</button>
      <button id="btnNew" class="big">নতুন খেলা</button>
      <button id="btnWalk" class="ghost">শুধু মিরপুরে হাঁটুন</button>
    </div>
    <ul id="help">
      <li><b>W A S D</b> হাঁটা</li><li><b>মাউস</b> চারপাশ দেখা</li>
      <li><b>Shift</b> দৌড়</li><li><b>C</b> বসে চলা</li>
      <li><b>E</b> ধরা / কথা বলা</li><li><b>F</b> দেশলাই</li>
      <li><b>Tab</b> সঙ্গের জিনিস</li><li><b>Esc</b> বিরতি</li>
    </ul>
    <p id="endCount" class="credit"></p>
    <p class="credit">মানচিত্রের তথ্য © OpenStreetMap contributors (ODbL)</p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
